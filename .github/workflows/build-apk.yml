name: Build APK

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giai nen project
        run: unzip -q lang-keo-project.zip -d app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build game (web)
        working-directory: app
        run: |
          npm install
          npm run build

      - name: Tao project Android
        working-directory: app
        run: |
          npx cap add android
          bash scripts/android-setup.sh
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Luu APK
        uses: actions/upload-artifact@v4
        with:
          name: LangKeo-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Tao Release de tai APK de hon
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Lang Keo APK ${{ github.run_number }}
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
